<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鈴鐺｜國高中學段預覽</title>
<style>
:root{--ink:#496a83;--accent:#b77943;--bg:#f6f0e6;--line:#ddd2c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#3f464b;font-family:system-ui,"Microsoft JhengHei",sans-serif}header{padding:24px max(20px,calc((100vw - 1050px)/2));border-bottom:1px solid var(--line);background:#fffdf9;color:var(--ink);font-size:22px;font-weight:700}.preview-note{text-align:center;background:#f5e6cc;padding:12px 20px;font-size:13px;line-height:1.6}.level-wrap{max-width:1090px;margin:auto;padding:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.level-wrap>span{font-size:13px;color:var(--accent);font-weight:700}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.level{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-height:55px;padding:9px 20px;border:1px solid var(--line);border-radius:30px;background:#fffdf9;color:var(--ink);text-decoration:none;font-weight:700;gap:2px}.level small{font-size:11px;font-weight:400}.level[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:white}main{max-width:1050px;margin:auto;padding:18px 20px 60px}h1{font-size:clamp(28px,5vw,42px);color:var(--ink);margin:10px 0}p{line-height:1.8;color:#766f68}.intro{margin-bottom:26px}.tools{background:#fffdf9;padding:20px;border:1px solid var(--line);border-radius:16px;display:grid;gap:18px}.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.filter-row>strong{font-size:13px;margin-right:8px}.chip{min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:22px;background:transparent;color:#625448}.chip[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}.scope{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:26px 0 12px;color:var(--ink)}.scope span{font-size:13px;color:#766f68}.events{display:grid;gap:12px}.event{display:grid;grid-template-columns:140px 1fr;gap:18px;background:#fffdf9;border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:12px;padding:20px}.event time{font-weight:700;color:var(--accent);line-height:1.6}.event h2{font-size:18px;margin:0 0 8px;color:var(--ink)}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:12px;padding:4px 8px;border-radius:6px;background:#edf0f4;color:#496a83}.tag.shared{background:#edf2e7;color:#536843}.event p{font-size:13px;margin:10px 0 0}.empty{padding:30px;border:1px dashed var(--line);border-radius:12px}footer{text-align:center;padding:24px;font-size:13px;color:#766f68;border-top:1px solid var(--line)}@media(max-width:600px){header{font-size:18px}.level-wrap>span{width:100%}.level{padding:8px 14px}.event{grid-template-columns:1fr;gap:8px}main{padding-top:6px}.tools{padding:16px}} 
[hidden]{display:none!important}.exam-hub{margin:26px 0;background:#fffdf9;border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:14px;padding:22px}.exam-hub h2{color:var(--ink);font-size:22px;margin:0 0 8px}.exam-hub summary{cursor:pointer;color:var(--ink);font-weight:700;min-height:44px;padding:12px 0}.milestones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.milestones article{background:#f6f3f8;border-radius:10px;padding:16px}.milestones h3{margin:0 0 10px;font-size:16px}.milestones small{display:block;color:#766f68;line-height:1.7;margin-top:8px}@media(max-width:600px){.milestones{grid-template-columns:1fr}} </style>
<header>🔔 小鈴鐺資訊整合（中學）</header>
<div class="preview-note">互動試作・僅選用少量行程示範，不是完整行事曆。日期依提供圖片摘錄，適用範圍仍待核對。</div>
<div class="level-wrap" role="navigation" aria-label="選擇學段"><span>逛逛小鈴鐺</span><a class="level" href="https://eilleenlan.github.io/lanbell-elementary-pages/#/">🔔 小學鈴噹</a><button class="level" data-level="junior"></button><button class="level" data-level="senior"></button></div>
<main><h1 id="heading"></h1><p class="intro" id="intro"></p><div class="tools"><div class="filter-row" id="grades" aria-label="選擇年級"></div><div class="filter-row" id="types" aria-label="選擇類別"></div><input id="search" aria-label="搜尋目前學段行程" placeholder="搜尋目前學段的活動，例如：段考、田教"></div><section class="exam-hub" id="exam-hub" hidden><h2>🎓 學測重要日程</h2><p>高三升學資訊獨立整理，不混在一般活動清單裡。</p><details id="exam-details"><summary>查看學測日程・資料整理中</summary><div class="milestones"><article><h3>報名與確認</h3><span class="tag">日期待核對</span><small>官方報名期間與校內辦理期限將分別標示。</small></article><article><h3>學測考試</h3><span class="tag">日期待核對</span><small>核對官方考試日期後，再加入學測倒數。</small></article><article><h3>成績與後續申請</h3><span class="tag">陸續整理</span><small>成績公布與後續升學項目，分批補齊來源及期限。</small></article></div><p>英聽、術科會另外標示為相關考試；此區目前為版面預覽，尚未填入正式日期。</p></details></section><div class="scope"><strong id="scope"></strong><span id="count" aria-live="polite"></span></div><div class="events" id="events"></div></main><footer>非官方網站，純屬家長交流參考，一切資訊以學校最新公告為準</footer>
<script>
// Preview fixtures only. This file does not import or change production events.
const samples=[
{date:'2026/08/31',title:'開學日',levels:['junior','senior'],grades:[],type:'活動',note:'共同行程示範：兩個學段各自看得到同一筆活動。'},
{date:'2026/09/08～09/09',title:'國九第一次模擬考',levels:['junior'],grades:[9],type:'考試'},
{date:'2026/09/02～09/03',title:'高三第二次模擬考',levels:['senior'],grades:[12],type:'考試'},
{date:'2026/09/10～09/11',title:'高一過夜田教',levels:['senior'],grades:[10],type:'田教',note:'庚、辛班；依高一田教修訂圖。'},
{date:'2026/09/22',title:'高三／國九家長會',levels:['junior','senior'],grades:[9,12],type:'活動'},
{date:'2026/10/13～10/14',title:'第一次段考',levels:['junior','senior'],grades:[],type:'考試',note:'同日期示範；各年級考科與考程仍應分別維護，適用年級待逐項核對。'},
{date:'2026/10/22～10/23',title:'高二過夜田教',levels:['senior'],grades:[11],type:'田教',note:'庚、辛班；依高二田教圖。'},
{date:'2026/10/28～10/29',title:'高三第三次模擬考',levels:['senior'],grades:[12],type:'考試'},
{date:'2027/01/19～01/20',title:'高一／高二第三次段考',levels:['senior'],grades:[10,11],type:'考試',note:'依高中考試修訂圖。'}];
let level='junior',grade=0,type='全部';
const names={junior:'國中',senior:'高中'}, gradeNames={7:'國七',8:'國八',9:'國九',10:'高一',11:'高二',12:'高三'};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function list(){const query=document.querySelector('#search').value.trim();const rows=samples.filter(e=>e.levels.includes(level)&&(!grade||!e.grades.length||e.grades.includes(grade))&&(type==='全部'||e.type===type)&&(!query||(e.title+' '+(e.note||'')).includes(query))).sort((a,b)=>a.date.localeCompare(b.date));document.querySelector('#scope').textContent='目前只看：'+names[level]+'・'+(grade?gradeNames[grade]:'全部年級');document.querySelector('#count').textContent=rows.length+' 筆範例行程';document.querySelector('#events').innerHTML=rows.map(e=>{const grades=e.grades.filter(g=>level==='junior'?g<10:g>=10);return `<article class="event"><time>${e.date}</time><div><h2>${escapeHtml(e.title)}</h2><div class="tags"><span class="tag">${e.type}</span><span class="tag">${grades.length?grades.map(g=>gradeNames[g]).join('、'):names[level]+'各年級（示範）'}</span>${e.levels.length>1?'<span class="tag shared">國高中共同行程</span>':''}</div>${e.note?'<p>'+escapeHtml(e.note)+'</p>':''}</div></article>`}).join('')||'<div class="empty">這組條件沒有範例行程，試試其他年級或類別。</div>';}
function controls(){document.querySelector("#exam-hub").hidden=level!=="senior";document.querySelector("#exam-details").open=level==="senior"&&(grade===0||grade===12);document.body.style.setProperty('--ink',level==='junior'?'#496a83':'#74638b');document.querySelectorAll('[data-level]').forEach(b=>{const current=b.dataset.level===level;b.setAttribute('aria-pressed',String(current));b.innerHTML='🔔 '+names[b.dataset.level]+'鈴鐺'+(current?'<small>你在這裡</small>':'');});document.querySelector('#heading').textContent=names[level]+'行事曆';document.querySelector('#intro').textContent=level==='junior'?'維持國中家長熟悉的查詢方式，只顯示國中適用行程。':'先看高中行程，再選高一、高二或高三，縮小到你關心的資訊。';document.querySelector('#grades').innerHTML='<strong>年級</strong>'+[0,...(level==='junior'?[7,8,9]:[10,11,12])].map(g=>`<button class="chip" data-grade="${g}" aria-pressed="${grade===g}">${g?gradeNames[g]:'全部'+names[level]}</button>`).join('');document.querySelector('#types').innerHTML='<strong>類別</strong>'+['全部','考試','田教','活動'].map(t=>`<button class="chip" data-type="${t}" aria-pressed="${type===t}">${t}</button>`).join('');list();}
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;grade=0;type='全部';document.querySelector('#search').value='';controls();});document.querySelector('#grades').onclick=e=>{const b=e.target.closest('[data-grade]');if(b){grade=Number(b.dataset.grade);controls();}};document.querySelector('#types').onclick=e=>{const b=e.target.closest('[data-type]');if(b){type=b.dataset.type;controls();}};document.querySelector('#search').oninput=list;controls();
</script></html>
